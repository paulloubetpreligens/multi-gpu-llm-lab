[project]
name = "multi-gpu-llm-lab"
version = "0.0.1"
description = "Multi-GPU training infrastructure for GPT-2, benchmarked against a frozen nanoGPT architecture."
authors = [
    {name="Paul Loubet"},
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0,<3.0",
    "torch>=2.11.0,<3.0.0",
    "transformers>=5.5.0,<6.0.0",
    "tiktoken>=0.8,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6.1,<7",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["multi_gpu_llm_lab"]

[[tool.mypy.overrides]]
module = ["transformers.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
omit = ["tests/*"]
